name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps (incl. dev extras for pytest)
        run: uv sync --extra dev
      - name: Ruff check
        run: uv run ruff check src/
      - name: Ruff format check
        run: uv run ruff format --check src/
      - name: Pyright
        run: uv run --extra dev pyright src/ || uvx pyright src/
      - name: Pytest
        run: uv run --extra dev pytest tests/ -q

  webapp:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web_sota
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install (bun preferred, npm fallback)
        run: bun install || npm ci
      - name: Biome CI
        run: bun run biome:ci || npx @biomejs/biome ci .
      - name: Typecheck
        run: npx tsc --noEmit
